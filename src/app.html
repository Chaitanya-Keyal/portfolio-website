<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/fira-code-latin-400-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// Apply persisted theme and CRT preference before first paint to avoid a flash.
			try {
				const theme = localStorage.getItem('theme');
				if (theme) document.documentElement.dataset.theme = theme;
				const crt = localStorage.getItem('crt');
				if (crt) document.documentElement.dataset.crt = crt;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
