name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The base path step reads the custom domain from the Pages settings.
      pages: read
    steps:
      - uses: actions/checkout@v7
      # Third-party, so pinned to a commit (v2.2.0) rather than a tag that can move.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: bun run fonts
      - run: bun run og
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - name: resume pdf
        # After the fast checks, since installing TeX is the slow step. pdflatex
        # plus the resume builder's own TeX files: the same PDF the builder shows.
        env:
          RESUME_PHONE: '+91 9148043218'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends texlive-latex-base >/dev/null
          bun run resume
      - name: resolve base path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without a custom domain, project Pages serves under /<repo>.
          cname=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // empty' || true)
          if [ -z "$cname" ]; then
            echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi
      - run: bun run build
      - name: check the address files
        # Wallets and nostr clients read these byte for byte, so the build must ship them as is.
        run: |
          cmp static/.well-known/lnurlp/okaybro build/.well-known/lnurlp/okaybro
          cmp static/.well-known/nostr.json build/.well-known/nostr.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build
          # v4 always leaves dot directories out, v5 only by default, and the Lightning
          # address lives in .well-known/lnurlp/.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
