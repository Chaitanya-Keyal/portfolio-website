name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run fonts
      - run: bun run og
      - run: bun run check
      - run: bun run test
      - name: resolve base path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without a custom domain, project Pages serves under /<repo>.
          cname=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // empty' || true)
          if [ -z "$cname" ]; then
            echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
