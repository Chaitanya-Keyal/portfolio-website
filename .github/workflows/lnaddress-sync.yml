# Re-copies the Lightning address file from the LNbits behind it (satpost) when its response
# changes; see scripts/lnaddress-sync.mjs. A refused or failed fetch fails the run, which is
# the alert.
name: lnaddress sync

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lnaddress-sync
  cancel-in-progress: false

env:
  LNADDRESS_SOURCE: https://pay.chaitanyakeyal.com/.well-known/lnurlp/okaybro
  LNADDRESS_TARGET: static/.well-known/lnurlp/okaybro
  LNADDRESS_IDENTIFIER: okaybro@chaitanyakeyal.com
  LNADDRESS_CALLBACK_HOST: pay.chaitanyakeyal.com
  # The zap key the response must keep, and the live copy that must match once it's current.
  LNADDRESS_NOSTR_PUBKEY: bc0e2b085b699abf917c43ba72ae036b32e3c393cd0a19d21b7b10cc64611c69
  LNADDRESS_PUBLISHED_URL: https://chaitanyakeyal.com/.well-known/lnurlp/okaybro
  DEPLOY_WORKFLOW: deploy.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - id: sync
        run: node scripts/lnaddress-sync.mjs
      - name: commit and redeploy
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore(lnaddress): sync the lightning address file'
          git pull --rebase
          git push
          if [ -n "$DEPLOY_WORKFLOW" ]; then gh workflow run "$DEPLOY_WORKFLOW" --ref "$GITHUB_REF_NAME"; fi
      - name: keep the schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub disables a public repo's schedules after 60 days without activity, and this
        # job only commits when something changed. Re-enabling on every run holds that off.
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/lnaddress-sync.yml/enable"
