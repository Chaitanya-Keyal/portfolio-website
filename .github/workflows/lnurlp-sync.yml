name: lnurlp sync

# Re-copies the Lightning address from Wallet of Satoshi when WoS changes it; see
# scripts/lnurlp-sync.js. A refused or failed fetch fails the run, which is the alert.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lnurlp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - id: sync
        run: node scripts/lnurlp-sync.js
      - name: commit and redeploy
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore(lnurlp): sync the lightning address from wallet of satoshi'
          git pull --rebase
          git push
          # A push made with GITHUB_TOKEN doesn't start other workflows; a dispatch does.
          gh workflow run deploy.yml --ref main
      - name: keep the schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub disables a public repo's schedules after 60 days without activity, and this job
        # only commits when WoS changes something. Re-enabling on every run holds that off
        # without dummy commits.
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/lnurlp-sync.yml/enable"
